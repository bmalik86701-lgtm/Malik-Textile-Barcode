name: Build Malik Textile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android Project
        run: unzip Malik_Textile_Barcode_Android_Project.zip

      - name: Fix Java version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("MalikTextileBarcodeAndroid/app/build.gradle")
          s = p.read_text()
          s = s.replace(
              "android {\n",
              "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n",
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p MalikTextileBarcodeAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malik-Textile-Barcode-APK
          path: MalikTextileBarcodeAndroid/app/build/outputs/apk/debug/app-debug.apk
