
name: Build Malik Textile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V3
        run: |
          unzip -o MalikTextile_V3.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/MalikTextileBarcodeAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malik-Textile-Barcode-APK
          path: extracted/MalikTextileBarcodeAndroid/app/build/outputs/apk/debug/app-debug.apk
          
