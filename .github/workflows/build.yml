name: Build Malik Textile V3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V3
        run: unzip Malik_Textile_Barcode_Printer_V3_Bulk_Excel_Project.zip

      - name: Build APK
        run: gradle -p MalikTextileBarcodeAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malik-Textile-Barcode-V3
          path: MalikTextileBarcodeAndroid/app/build/outputs/apk/debug/app-debug.apk
